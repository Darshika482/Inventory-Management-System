# Builds the small Android helper that opens the customer's WhatsApp chat with
# the bill file attached, and publishes it at a fixed link:
# https://github.com/Darshika482/Inventory-Management-System/releases/download/whatsapp-helper/akshay-whatsapp-helper.apk
name: WhatsApp helper APK

on:
  push:
    paths:
      - 'android-helper/**'
      - '.github/workflows/whatsapp-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Optional: a fixed signing key (GitHub secrets), so new versions install
      # over the old one. Without it the APK is signed with a debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HELPER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/helper.jks"
            echo "HELPER_KEYSTORE_FILE=$RUNNER_TEMP/helper.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android-helper
        env:
          HELPER_KEYSTORE_PASSWORD: ${{ secrets.HELPER_KEYSTORE_PASSWORD }}
          HELPER_KEY_ALIAS: ${{ secrets.HELPER_KEY_ALIAS }}
          HELPER_KEY_PASSWORD: ${{ secrets.HELPER_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/akshay-whatsapp-helper.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: akshay-whatsapp-helper
          path: akshay-whatsapp-helper.apk

      - name: Publish at the fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whatsapp-helper
          name: Akshay WhatsApp helper (Android)
          body: |
            Install this on the shop phone once. Then Share → Send PDF / Send image in the
            Akshay Traders app opens the customer's WhatsApp chat with the bill attached.
            Built from ${{ github.sha }}.
          make_latest: false
          files: akshay-whatsapp-helper.apk
